# Nasiya Pro — production stack on one server.
#
#   cp deploy/.env.prod.example deploy/.env.prod   # then fill it in
#   docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build
#
#   Internet --443--> caddy (TLS) --/api/*--> backend (FastAPI + bot) --> postgres, redis
#                                 \--/*-----> frontend (nginx, Mini App)
#
# Only Caddy publishes ports. PostgreSQL and Redis live on an internal network with no
# route to the outside world.

name: nasiya-pro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nasiya_pro}
      POSTGRES_USER: ${POSTGRES_USER:-nasiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nasiya-pro-backend:latest
    restart: unless-stopped
    env_file: deploy/.env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nasiya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nasiya_pro}
      REDIS_URL: redis://redis:6379/0
      WEBAPP_URL: https://${DOMAIN:?set DOMAIN in deploy/.env.prod}
      BOT_WEBHOOK_BASE_URL: https://${DOMAIN}
      BOT_MODE: ${BOT_MODE:-webhook}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # internal: database + redis · edge: reachable by Caddy and able to call
    # api.telegram.org (the internal network has no Internet access).
    networks: [internal, edge]
    stop_grace_period: 30s
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: nasiya-pro-frontend:latest
    restart: unless-stopped
    networks: [edge]
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [edge]
    logging: *logging

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
